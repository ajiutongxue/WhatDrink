<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1624" preserveAspectRatio="xMidYMid slice">
  <!-- Sun overlay: warm glow + radiating rays (暖屿 style) -->
  <defs>
    <radialGradient id="oSunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F6B98E" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#F2C4A0" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#F2C4A0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F2C4A0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oSunCore" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FBD3AC"/>
      <stop offset="100%" stop-color="#EFA074"/>
    </radialGradient>
  </defs>
  <!-- Outer glow -->
  <circle cx="540" cy="340" r="280" fill="url(#oSunGlow)"/>
  <!-- Sun disc -->
  <circle cx="540" cy="340" r="90" fill="url(#oSunCore)"/>
  <!-- Primary rays -->
  <g stroke="#F2C4A0" stroke-width="3.5" stroke-linecap="round" opacity="0.5">
    <line x1="540" y1="200" x2="540" y2="160"/>
    <line x1="540" y1="480" x2="540" y2="520"/>
    <line x1="400" y1="340" x2="360" y2="340"/>
    <line x1="680" y1="340" x2="720" y2="340"/>
    <line x1="441" y1="241" x2="413" y2="213"/>
    <line x1="639" y1="241" x2="667" y2="213"/>
    <line x1="441" y1="439" x2="413" y2="467"/>
    <line x1="639" y1="439" x2="667" y2="467"/>
  </g>
  <!-- Secondary shorter rays -->
  <g stroke="#F6B98E" stroke-width="2.5" stroke-linecap="round" opacity="0.3">
    <line x1="475" y1="218" x2="458" y2="196"/>
    <line x1="605" y1="218" x2="622" y2="196"/>
    <line x1="475" y1="462" x2="458" y2="484"/>
    <line x1="605" y1="462" x2="622" y2="484"/>
    <line x1="418" y1="275" x2="396" y2="258"/>
    <line x1="662" y1="275" x2="684" y2="258"/>
    <line x1="418" y1="405" x2="396" y2="422"/>
    <line x1="662" y1="405" x2="684" y2="422"/>
  </g>
</svg>
