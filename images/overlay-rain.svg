<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1624" preserveAspectRatio="xMidYMid slice">
  <!-- Rain overlay: cloud mass + diagonal rain streaks -->
  <defs>
    <linearGradient id="oRainCloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#98A2AC"/>
      <stop offset="100%" stop-color="#A8B2BC"/>
    </linearGradient>
  </defs>
  <!-- Dark rain clouds at top -->
  <g fill="url(#oRainCloud)" opacity="0.6">
    <ellipse cx="200" cy="130" rx="190" ry="72"/>
    <ellipse cx="400" cy="110" rx="210" ry="80"/>
    <ellipse cx="600" cy="140" rx="180" ry="68"/>
    <ellipse cx="300" cy="170" rx="170" ry="60"/>
    <ellipse cx="520" cy="180" rx="190" ry="62"/>
  </g>
  <!-- Rain streaks: three depth layers -->
  <g stroke="#9FB0BC" stroke-linecap="round">
    <!-- Far layer (thin, light) -->
    <g stroke-width="1.5" opacity="0.3">
      <line x1="80" y1="260" x2="62" y2="360"/>
      <line x1="200" y1="300" x2="182" y2="400"/>
      <line x1="350" y1="270" x2="332" y2="370"/>
      <line x1="520" y1="290" x2="502" y2="390"/>
      <line x1="680" y1="260" x2="662" y2="360"/>
      <line x1="140" y1="450" x2="122" y2="550"/>
      <line x1="420" y1="470" x2="402" y2="570"/>
      <line x1="600" y1="440" x2="582" y2="540"/>
    </g>
    <!-- Mid layer -->
    <g stroke-width="2.5" opacity="0.45">
      <line x1="130" y1="240" x2="108" y2="360"/>
      <line x1="280" y1="280" x2="258" y2="400"/>
      <line x1="440" y1="250" x2="418" y2="370"/>
      <line x1="590" y1="300" x2="568" y2="420"/>
      <line x1="710" y1="270" x2="688" y2="390"/>
      <line x1="60" y1="480" x2="38" y2="600"/>
      <line x1="320" y1="500" x2="298" y2="620"/>
      <line x1="540" y1="480" x2="518" y2="600"/>
      <line x1="700" y1="510" x2="678" y2="630"/>
    </g>
    <!-- Near layer (thick, prominent) -->
    <g stroke-width="3.5" opacity="0.55">
      <line x1="170" y1="320" x2="142" y2="470"/>
      <line x1="360" y1="350" x2="332" y2="500"/>
      <line x1="550" y1="330" x2="522" y2="480"/>
      <line x1="250" y1="550" x2="222" y2="700"/>
      <line x1="470" y1="570" x2="442" y2="720"/>
      <line x1="650" y1="540" x2="622" y2="690"/>
    </g>
  </g>
</svg>
