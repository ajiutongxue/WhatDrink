<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1624" preserveAspectRatio="xMidYMid slice">
  <!-- Fog / haze overlay: layered horizontal mist bands -->
  <defs>
    <linearGradient id="oFogBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Upper thin haze -->
  <ellipse cx="375" cy="650" rx="520" ry="55" fill="url(#oFogBand)" opacity="0.4"/>
  <!-- Main fog bands (mid to lower) -->
  <ellipse cx="300" cy="800" rx="550" ry="75" fill="url(#oFogBand)" opacity="0.55"/>
  <ellipse cx="450" cy="920" rx="520" ry="80" fill="url(#oFogBand)" opacity="0.5"/>
  <ellipse cx="280" cy="1050" rx="560" ry="85" fill="url(#oFogBand)" opacity="0.45"/>
  <ellipse cx="420" cy="1180" rx="540" ry="78" fill="url(#oFogBand)" opacity="0.4"/>
  <!-- Lower thick fog near hills -->
  <ellipse cx="375" cy="1300" rx="580" ry="90" fill="url(#oFogBand)" opacity="0.35"/>
  <ellipse cx="350" cy="1420" rx="560" ry="80" fill="url(#oFogBand)" opacity="0.3"/>
</svg>
