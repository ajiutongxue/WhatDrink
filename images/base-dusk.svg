<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1624" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="duskSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E4E80"/>
      <stop offset="20%" stop-color="#8A5E82"/>
      <stop offset="40%" stop-color="#C47872"/>
      <stop offset="58%" stop-color="#E89468"/>
      <stop offset="74%" stop-color="#F4B478"/>
      <stop offset="88%" stop-color="#F8CC90"/>
      <stop offset="100%" stop-color="#FAE0B0"/>
    </linearGradient>
    <radialGradient id="duskGlow" cx="32%" cy="64%" r="38%">
      <stop offset="0%" stop-color="#FFD480" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#F0A060" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F0A060" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="duskHill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9A7478"/>
      <stop offset="100%" stop-color="#A88480"/>
    </linearGradient>
    <linearGradient id="duskHill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#846468"/>
      <stop offset="100%" stop-color="#947470"/>
    </linearGradient>
    <linearGradient id="duskHill3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E7E64"/>
      <stop offset="100%" stop-color="#7E8E72"/>
    </linearGradient>
    <linearGradient id="duskHill4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#566E58"/>
      <stop offset="100%" stop-color="#667E64"/>
    </linearGradient>
    <linearGradient id="duskHill5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#445C4A"/>
      <stop offset="100%" stop-color="#546C56"/>
    </linearGradient>
  </defs>

  <!-- Sky: purple → orange → golden -->
  <rect width="750" height="1624" fill="url(#duskSky)"/>
  <ellipse cx="240" cy="1040" rx="360" ry="300" fill="url(#duskGlow)"/>

  <!-- Distant hills (warm silhouette) -->
  <path d="M0 1080 Q120 1020 260 1060 Q400 1100 520 1050 Q640 1000 750 1040 L750 1624 L0 1624 Z" fill="url(#duskHill1)" opacity="0.6"/>

  <!-- Mid-distant -->
  <path d="M0 1160 Q160 1080 340 1140 Q500 1190 620 1130 Q700 1100 750 1120 L750 1624 L0 1624 Z" fill="url(#duskHill2)" opacity="0.75"/>

  <!-- Warm haze -->
  <ellipse cx="375" cy="1170" rx="500" ry="30" fill="#F4B478" opacity="0.18"/>

  <!-- Mid hills -->
  <path d="M0 1280 Q180 1180 380 1260 Q560 1330 680 1270 Q720 1250 750 1260 L750 1624 L0 1624 Z" fill="url(#duskHill3)"/>
  <g stroke="#5E7458" stroke-width="1.2" fill="none" opacity="0.3">
    <path d="M60 1320 Q200 1280 360 1310 Q500 1340 640 1300"/>
    <path d="M40 1360 Q190 1320 370 1350 Q520 1380 680 1340"/>
    <path d="M20 1400 Q180 1360 380 1390 Q540 1420 700 1380"/>
  </g>

  <!-- Near hills -->
  <path d="M0 1420 Q200 1340 420 1410 Q600 1470 750 1430 L750 1624 L0 1624 Z" fill="url(#duskHill4)"/>
  <g stroke="#4A6248" stroke-width="1.4" fill="none" opacity="0.25">
    <path d="M30 1460 Q200 1420 400 1450 Q580 1480 720 1450"/>
    <path d="M10 1500 Q190 1460 400 1490 Q590 1520 740 1490"/>
  </g>

  <!-- Foreground -->
  <path d="M0 1530 Q180 1470 380 1520 Q560 1560 750 1530 L750 1624 L0 1624 Z" fill="url(#duskHill5)"/>

  <!-- Warm atmospheric haze at base -->
  <ellipse cx="375" cy="1200" rx="460" ry="36" fill="#E89468" opacity="0.12"/>
</svg>
