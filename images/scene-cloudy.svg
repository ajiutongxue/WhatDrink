<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1624" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cloudySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E6E0EC"/>
      <stop offset="40%" stop-color="#F0EAE6"/>
      <stop offset="74%" stop-color="#F1EAE1"/>
      <stop offset="100%" stop-color="#EDE4DA"/>
    </linearGradient>
    <radialGradient id="softLight" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FBF3E7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FBF3E7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cHillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCD2CC"/>
      <stop offset="100%" stop-color="#E6DCD3"/>
    </linearGradient>
    <linearGradient id="cHillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B7C4B4"/>
      <stop offset="100%" stop-color="#C9D4C2"/>
    </linearGradient>
    <linearGradient id="cHillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AAE97"/>
      <stop offset="100%" stop-color="#AFC2A6"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="750" height="1624" fill="url(#cloudySky)"/>
  <ellipse cx="375" cy="380" rx="420" ry="300" fill="url(#softLight)"/>

  <!-- Soft round clouds -->
  <g fill="#FBF6EE" opacity="0.92">
    <g>
      <ellipse cx="200" cy="300" rx="120" ry="60"/>
      <ellipse cx="290" cy="280" rx="90" ry="66"/>
      <ellipse cx="130" cy="320" rx="80" ry="52"/>
    </g>
    <g opacity="0.85">
      <ellipse cx="560" cy="470" rx="130" ry="64"/>
      <ellipse cx="650" cy="450" rx="86" ry="58"/>
      <ellipse cx="480" cy="490" rx="78" ry="50"/>
    </g>
  </g>
  <g fill="#E7D8CE" opacity="0.5">
    <ellipse cx="220" cy="330" rx="120" ry="24"/>
    <ellipse cx="575" cy="500" rx="130" ry="24"/>
  </g>

  <!-- Rolling hills -->
  <path d="M0 1180 Q180 1060 380 1150 T750 1120 L750 1624 L0 1624 Z" fill="url(#cHillBack)"/>
  <path d="M0 1320 Q220 1200 460 1300 T750 1280 L750 1624 L0 1624 Z" fill="url(#cHillMid)"/>
  <path d="M0 1460 Q200 1360 420 1450 T750 1430 L750 1624 L0 1624 Z" fill="url(#cHillFront)"/>

  <!-- Mist band -->
  <ellipse cx="375" cy="1300" rx="520" ry="60" fill="#FBF6EE" opacity="0.35"/>
</svg>
