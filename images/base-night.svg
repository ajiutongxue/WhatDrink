<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1624" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141A38"/>
      <stop offset="25%" stop-color="#1E2648"/>
      <stop offset="48%" stop-color="#2A3258"/>
      <stop offset="70%" stop-color="#363E64"/>
      <stop offset="88%" stop-color="#424A6C"/>
      <stop offset="100%" stop-color="#4E5474"/>
    </linearGradient>
    <radialGradient id="nightGlow" cx="50%" cy="72%" r="42%">
      <stop offset="0%" stop-color="#5A5880" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5A5880" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nHill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4258"/>
      <stop offset="100%" stop-color="#424A5E"/>
    </linearGradient>
    <linearGradient id="nHill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#323A50"/>
      <stop offset="100%" stop-color="#3A4254"/>
    </linearGradient>
    <linearGradient id="nHill3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A3444"/>
      <stop offset="100%" stop-color="#323C4A"/>
    </linearGradient>
    <linearGradient id="nHill4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222E3C"/>
      <stop offset="100%" stop-color="#2A3642"/>
    </linearGradient>
    <linearGradient id="nHill5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C2834"/>
      <stop offset="100%" stop-color="#243038"/>
    </linearGradient>
  </defs>

  <!-- Sky: deep indigo -->
  <rect width="750" height="1624" fill="url(#nightSky)"/>
  <ellipse cx="375" cy="1080" rx="460" ry="320" fill="url(#nightGlow)"/>

  <!-- Stars -->
  <g fill="#E8E4F0" opacity="0.6">
    <circle cx="120" cy="180" r="1.5"/>
    <circle cx="280" cy="120" r="1"/>
    <circle cx="420" cy="200" r="1.8"/>
    <circle cx="560" cy="140" r="1.2"/>
    <circle cx="650" cy="260" r="1.5"/>
    <circle cx="180" cy="320" r="1"/>
    <circle cx="500" cy="340" r="1.3"/>
    <circle cx="340" cy="380" r="0.9"/>
    <circle cx="680" cy="420" r="1.1"/>
    <circle cx="90" cy="460" r="1.4"/>
    <circle cx="600" cy="520" r="1"/>
    <circle cx="240" cy="540" r="1.2"/>
  </g>

  <!-- Distant hills -->
  <path d="M0 1080 Q120 1020 260 1060 Q400 1100 520 1050 Q640 1000 750 1040 L750 1624 L0 1624 Z" fill="url(#nHill1)" opacity="0.7"/>

  <!-- Mid-distant -->
  <path d="M0 1160 Q160 1080 340 1140 Q500 1190 620 1130 Q700 1100 750 1120 L750 1624 L0 1624 Z" fill="url(#nHill2)" opacity="0.8"/>

  <!-- Faint mist -->
  <ellipse cx="375" cy="1170" rx="500" ry="28" fill="#4E5474" opacity="0.2"/>

  <!-- Mid hills -->
  <path d="M0 1280 Q180 1180 380 1260 Q560 1330 680 1270 Q720 1250 750 1260 L750 1624 L0 1624 Z" fill="url(#nHill3)"/>
  <g stroke="#3A4858" stroke-width="1.2" fill="none" opacity="0.2">
    <path d="M60 1320 Q200 1280 360 1310 Q500 1340 640 1300"/>
    <path d="M40 1360 Q190 1320 370 1350 Q520 1380 680 1340"/>
  </g>

  <!-- Near hills -->
  <path d="M0 1420 Q200 1340 420 1410 Q600 1470 750 1430 L750 1624 L0 1624 Z" fill="url(#nHill4)"/>

  <!-- Foreground -->
  <path d="M0 1530 Q180 1470 380 1520 Q560 1560 750 1530 L750 1624 L0 1624 Z" fill="url(#nHill5)"/>

  <!-- Subtle night mist -->
  <ellipse cx="375" cy="1300" rx="480" ry="32" fill="#424A6C" opacity="0.15"/>
</svg>
