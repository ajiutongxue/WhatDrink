<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1624" preserveAspectRatio="xMidYMid slice">
  <!-- Snow overlay: soft cloud top + scattered snowflakes at varied depths -->
  <defs>
    <radialGradient id="oSnowFlake" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  <!-- Light snow clouds at top -->
  <g fill="#D8DDE4" opacity="0.5">
    <ellipse cx="200" cy="110" rx="180" ry="65"/>
    <ellipse cx="420" cy="95" rx="200" ry="72"/>
    <ellipse cx="620" cy="120" rx="170" ry="60"/>
    <ellipse cx="320" cy="150" rx="160" ry="55"/>
  </g>
  <!-- Snowflakes: three depth layers -->
  <g fill="url(#oSnowFlake)">
    <!-- Far (small, faint) -->
    <g opacity="0.4">
      <circle cx="90" cy="250" r="3"/>
      <circle cx="210" cy="300" r="2.5"/>
      <circle cx="380" cy="270" r="3"/>
      <circle cx="530" cy="240" r="2.5"/>
      <circle cx="670" cy="290" r="3"/>
      <circle cx="150" cy="420" r="2.5"/>
      <circle cx="450" cy="440" r="3"/>
      <circle cx="620" cy="410" r="2.5"/>
      <circle cx="300" cy="560" r="3"/>
      <circle cx="550" cy="580" r="2.5"/>
    </g>
    <!-- Mid -->
    <g opacity="0.6">
      <circle cx="140" cy="320" r="4"/>
      <circle cx="310" cy="350" r="4.5"/>
      <circle cx="480" cy="330" r="4"/>
      <circle cx="640" cy="360" r="4.5"/>
      <circle cx="60" cy="500" r="4"/>
      <circle cx="240" cy="520" r="4.5"/>
      <circle cx="420" cy="540" r="4"/>
      <circle cx="590" cy="510" r="4.5"/>
      <circle cx="710" cy="540" r="4"/>
      <circle cx="180" cy="660" r="4.5"/>
      <circle cx="380" cy="680" r="4"/>
      <circle cx="560" cy="650" r="4.5"/>
    </g>
    <!-- Near (large, prominent) -->
    <g opacity="0.8">
      <circle cx="200" cy="240" r="6"/>
      <circle cx="420" cy="280" r="5.5"/>
      <circle cx="600" cy="250" r="6"/>
      <circle cx="100" cy="440" r="5.5"/>
      <circle cx="340" cy="460" r="6"/>
      <circle cx="520" cy="430" r="5.5"/>
      <circle cx="700" cy="460" r="6"/>
      <circle cx="260" cy="620" r="5.5"/>
      <circle cx="480" cy="640" r="6"/>
      <circle cx="650" cy="610" r="5.5"/>
    </g>
  </g>
</svg>
