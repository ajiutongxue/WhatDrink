<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1624" preserveAspectRatio="xMidYMid slice">
  <!-- Moon + stars overlay -->
  <defs>
    <radialGradient id="oMoonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8E4F0" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#D8D4E8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#D8D4E8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Moon glow halo -->
  <circle cx="560" cy="280" r="140" fill="url(#oMoonGlow)"/>
  <!-- Crescent moon -->
  <circle cx="560" cy="280" r="52" fill="#F0ECD8" opacity="0.92"/>
  <circle cx="580" cy="266" r="44" fill="#2A3058" opacity="0.88"/>
  <!-- Stars: varied sizes for depth -->
  <g fill="#F0ECD8">
    <circle cx="180" cy="160" r="3.5" opacity="0.85"/>
    <circle cx="320" cy="220" r="2.5" opacity="0.6"/>
    <circle cx="120" cy="320" r="2" opacity="0.5"/>
    <circle cx="420" cy="130" r="2.5" opacity="0.7"/>
    <circle cx="660" cy="180" r="3" opacity="0.75"/>
    <circle cx="700" cy="320" r="2" opacity="0.5"/>
    <circle cx="480" cy="380" r="2" opacity="0.45"/>
    <circle cx="260" cy="420" r="3" opacity="0.6"/>
    <circle cx="80" cy="480" r="2.5" opacity="0.5"/>
    <circle cx="600" cy="450" r="2" opacity="0.4"/>
    <circle cx="350" cy="500" r="2.5" opacity="0.5"/>
    <circle cx="150" cy="560" r="2" opacity="0.35"/>
  </g>
  <!-- Brighter cross-shaped stars -->
  <g stroke="#F0ECD8" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <line x1="240" y1="140" x2="240" y2="152"/>
    <line x1="234" y1="146" x2="246" y2="146"/>
    <line x1="640" y1="260" x2="640" y2="270"/>
    <line x1="635" y1="265" x2="645" y2="265"/>
  </g>
</svg>
