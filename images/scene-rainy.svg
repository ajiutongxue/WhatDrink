<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1624" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="rainySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D7DDE4"/>
      <stop offset="42%" stop-color="#E4E5E4"/>
      <stop offset="76%" stop-color="#E9E6E1"/>
      <stop offset="100%" stop-color="#E7E2DB"/>
    </linearGradient>
    <linearGradient id="rHillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CDD2D2"/>
      <stop offset="100%" stop-color="#D9DAD4"/>
    </linearGradient>
    <linearGradient id="rHillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A6B6AC"/>
      <stop offset="100%" stop-color="#B9C6BA"/>
    </linearGradient>
    <linearGradient id="rHillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86998C"/>
      <stop offset="100%" stop-color="#9BAD9C"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="750" height="1624" fill="url(#rainySky)"/>

  <!-- Heavier soft cloud mass -->
  <g fill="#C4C9CE" opacity="0.85">
    <ellipse cx="220" cy="270" rx="150" ry="72"/>
    <ellipse cx="330" cy="250" rx="110" ry="78"/>
    <ellipse cx="130" cy="300" rx="96" ry="60"/>
  </g>
  <g fill="#D3D7DA" opacity="0.9">
    <ellipse cx="560" cy="380" rx="160" ry="76"/>
    <ellipse cx="660" cy="360" rx="104" ry="66"/>
    <ellipse cx="470" cy="400" rx="92" ry="58"/>
  </g>

  <!-- Gentle rain lines -->
  <g stroke="#9FB0BC" stroke-width="3" stroke-linecap="round" opacity="0.35">
    <line x1="150" y1="480" x2="130" y2="560"/>
    <line x1="230" y1="520" x2="210" y2="600"/>
    <line x1="320" y1="470" x2="300" y2="550"/>
    <line x1="420" y1="530" x2="400" y2="610"/>
    <line x1="510" y1="490" x2="490" y2="570"/>
    <line x1="600" y1="540" x2="580" y2="620"/>
    <line x1="180" y1="660" x2="160" y2="740"/>
    <line x1="360" y1="680" x2="340" y2="760"/>
    <line x1="540" y1="660" x2="520" y2="740"/>
    <line x1="270" y1="800" x2="250" y2="880"/>
    <line x1="460" y1="820" x2="440" y2="900"/>
  </g>

  <!-- Rolling hills -->
  <path d="M0 1180 Q180 1060 380 1150 T750 1120 L750 1624 L0 1624 Z" fill="url(#rHillBack)"/>
  <path d="M0 1320 Q220 1200 460 1300 T750 1280 L750 1624 L0 1624 Z" fill="url(#rHillMid)"/>
  <path d="M0 1460 Q200 1360 420 1450 T750 1430 L750 1624 L0 1624 Z" fill="url(#rHillFront)"/>

  <!-- Mist layers -->
  <ellipse cx="375" cy="1280" rx="540" ry="56" fill="#E9E6E1" opacity="0.4"/>
  <ellipse cx="375" cy="1420" rx="560" ry="50" fill="#E9E6E1" opacity="0.3"/>
</svg>
