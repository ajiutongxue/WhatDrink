<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1624" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sunnySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBE0CC"/>
      <stop offset="38%" stop-color="#FBF0E2"/>
      <stop offset="72%" stop-color="#FAEADD"/>
      <stop offset="100%" stop-color="#F6E7D6"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F6B98E" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#F2C4A0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F2C4A0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunCore" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FBD3AC"/>
      <stop offset="100%" stop-color="#EFA074"/>
    </radialGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7D3C0"/>
      <stop offset="100%" stop-color="#EFDCCB"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B9CDAE"/>
      <stop offset="100%" stop-color="#CBDCBF"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9DB88F"/>
      <stop offset="100%" stop-color="#B4CBA6"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="750" height="1624" fill="url(#sunnySky)"/>

  <!-- Sun glow + core -->
  <circle cx="540" cy="360" r="320" fill="url(#sunGlow)"/>
  <circle cx="540" cy="360" r="120" fill="url(#sunCore)"/>

  <!-- Rolling hills (rounded, layered) -->
  <path d="M0 1180 Q180 1060 380 1150 T750 1120 L750 1624 L0 1624 Z" fill="url(#hillBack)"/>
  <path d="M0 1320 Q220 1200 460 1300 T750 1280 L750 1624 L0 1624 Z" fill="url(#hillMid)"/>
  <path d="M0 1460 Q200 1360 420 1450 T750 1430 L750 1624 L0 1624 Z" fill="url(#hillFront)"/>
</svg>
